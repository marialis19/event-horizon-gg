services:
  postgres:
    image: postgres:16-alpine
    container_name: event_horizon_db
    environment:
      POSTGRES_USER: eventhorizon
      POSTGRES_PASSWORD: blackhole2024
      POSTGRES_DB: event_horizon
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventhorizon -d event_horizon"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: event_horizon_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: